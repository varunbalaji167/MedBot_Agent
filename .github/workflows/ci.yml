name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # rag_core uses `X | None` annotations, so 3.10+.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The test suite needs only numpy + the stdlib (it injects fakes for the
      # embedding/generation/index), so we deliberately skip the heavy ML stack
      # (torch/faiss/transformers/streamlit) to keep CI fast.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Byte-compile sources (syntax check, no imports)
        run: python -m py_compile app.py rag_core.py test_rag_core.py

      - name: Run unit tests
        run: python -m unittest test_rag_core -v

  # Single stable check to mark "required" in branch protection, so the
  # required check doesn't change when the Python matrix changes.
  ci-success:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all test jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "all tests passed"
